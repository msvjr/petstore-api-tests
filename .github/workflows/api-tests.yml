name: API tests

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * 1"  # every Monday, to catch drift in the public sandbox

jobs:
  newman:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install -g newman newman-reporter-htmlextra
      - name: Run collection
        run: |
          newman run petstore.postman_collection.json \
            -e petstore.postman_environment.json \
            -r cli,htmlextra --reporter-htmlextra-export reports/report.html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: newman-report
          path: reports/
